<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my trips</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<section class="my-trips">
  <div class="trip-header">
    <h2>My Trips</h2>
    <p>Your past and upcoming travel adventures</p>
  </div>

  <div class="trip-grid">
    <div class="trip-card">
      <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80" alt="Paris">
      <div class="trip-content">
        <h3>Paris Getaway</h3>
        <p>Mode: ✈️ Flight</p>
        <p>Days: 5</p>
        <p>Budget: ₹45,000</p>
        <button class="details-btn">View Details</button>
      </div>
    </div>

    <div class="trip-card">
      <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80" alt="Goa">
      <div class="trip-content">
        <h3>Goa Escape</h3>
        <p>Mode: 🚆 Train</p>
        <p>Days: 3</p>
        <p>Budget: ₹12,000</p>
        <button class="details-btn">View Details</button>
      </div>
    </div>
  </div>
</section>


</body>
</html>
