<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Travio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="signup-page">

  <div class="signup-container">
    <h2>Welcome Back!</h2>
    <form>
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="email-btn">Login with Email</button>
      <div class="divider">or</div>
      <button type="button" class="google-btn">Login with Google</button>
      <p style="margin-top:10px;">Don’t have an account? 
        <a href="signup.html" style="color:#5a189a;">Sign Up</a>
      </p>
    </form>
  </div>

</body>
</html>
