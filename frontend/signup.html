<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Travio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
<body class="signup-page">

  <div class="signup-container">
    <h2>Create Your Account</h2>

    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>

      <button type="submit" class="email-btn">Sign Up with Email</button>
      <div class="divider">or</div>

      <button type="button" class="google-btn">Continue with Google</button>
      <button type="button" class="phone-btn">Continue with Phone OTP</button>
    </form>
  </div>


</body>
</html>
