<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create-trip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
<section class="create-trip">
  <h2>Create Your Trip</h2>

  <form class="trip-form">

    <label for="destination">Destination</label>
    <input type="text" id="destination" placeholder="Enter destination" required>

    <label for="start-date">Start Date</label>
    <input type="date" id="start-date" required>

    <label for="end-date">End Date</label>
    <input type="date" id="end-date" required>

    <label for="people">Number of Travelers</label>
    <input type="number" id="people" placeholder="How many people?" min="1" required>

    <label for="transport">Mode of Transport</label>
    <select id="transport" required>
      <option value="">--Select--</option>
      <option value="train">Train</option>
      <option value="flight">Flight</option>
      <option value="bus">Bus</option>
    </select>

    <label for="budget">Estimated Budget (₹)</label>
    <input type="number" id="budget" placeholder="Auto calculated..." readonly>

    <label for="details">Trip Details</label>
    <textarea id="details" placeholder="Describe your trip plan..." rows="3"></textarea>

    <button type="submit">Create Trip</button>
  </form>
</section>


</body>
</html>
